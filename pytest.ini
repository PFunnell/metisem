[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output formatting
addopts =
    -v
    --color=yes
    --strict-markers
    --tb=short
    --cov=metisem
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml

# Markers for test categorization
markers =
    integration: marks tests as integration tests (require test vault)
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_ollama: marks tests requiring Ollama service

# Coverage configuration
[coverage:run]
source = metisem
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
